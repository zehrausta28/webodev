<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
    background: #ffffff;
    margin: 0;
}

.login-container{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
}

.login-card {
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    background: #ffffff;
    color: #333;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

input {
    background: #ffffff !important;
    color: #333 !important;
    border: 1px solid #444 !important;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}
</style>

<script>
function validateForm() {
    const email = document.forms["loginForm"]["email"].value;
    const password = document.forms["loginForm"]["password"].value;

    if(email === "" || password === ""){
        alert("Tüm alanları doldur!");
        return false;
    }

    const emailPattern = /^[a-zA-Z0-9._%+-]+@sakarya\.edu\.tr$/;

    if(!emailPattern.test(email)){
        alert("Geçerli Sakarya maili gir!");
        return false;
    }

    const studentNo = email.split("@")[0];

    if(password !== studentNo){
        alert("Şifre, mailde @ işaretinden önceki kısım ile aynı olmalı!");
        return false;
    }

    return true;
}
</script>

</head>

<body>

<header class="bg-dark text-white shadow-sm mb-4">
    <div class="container py-4 text-center">
        <h1>Giriş Sayfası</h1>
    </div>
</header>

<div class="login-container">
    <div class="login-card">
        <h2>🔐 Giriş Yap</h2>

        <form name="loginForm" action="sonuc.html" method="GET" onsubmit="return validateForm()">

            <div class="mb-3">
                <label>Mail</label>
                <input type="text" name="email" class="form-control" placeholder="b251210019@sakarya.edu.tr">
            </div>

            <div class="mb-3">
                <label>Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="Öğrenci No">
            </div>

            <button type="submit" class="btn btn-danger w-100">Giriş Yap</button>

        </form>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-4">
    © 2024 Zehra Usta. Tüm hakları saklıdır.
</footer>

</body>
</html>
