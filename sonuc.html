
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sonucu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow mx-auto" style="max-width:700px;">
        <div class="card-header bg-success text-white">
            <h3>Gönderilen Bilgiler</h3>
        </div>

        <div class="card-body" id="resultBox">
        </div>

        <div class="card-footer text-end">
            <button class="btn btn-primary" onclick="goBack()">
                Başka Bir Form Gönder
            </button>
        </div>
    </div>
</div>

<script>
    const data = JSON.parse(localStorage.getItem("surveyData"));

    if(data){
        document.getElementById("resultBox").innerHTML = `
            <p><strong>Ad Soyad:</strong> ${data.fullname}</p>
            <p><strong>E-posta:</strong> ${data.email}</p>
            <p><strong>Yaş Aralığı:</strong> ${data.age}</p>
            <p><strong>Cinsiyet:</strong> ${data.gender}</p>
            <p><strong>İlgi Alanları:</strong> ${data.interests.join(", ")}</p>
        `;
    } else {
        document.getElementById("resultBox").innerHTML =
            "<p>Gösterilecek veri bulunamadı.</p>";
    }

    function goBack() {
        window.location.href = "iletisim.html";
    }
</script>

</body>
</html>
